name: reportenv

# =============================================================
# reportEnv/docker-compose-report.yml
# 用途：报送层验证环境（独立于 dist 主栈运行）
#
# 启动前提：
#   dist/ 主栈已启动（macdanet 网络已存在）：
#     cd dist && ./start.sh mock
#
# 启动报送层：
#   cd reportEnv
#   docker compose -f docker-compose-report.yml up -d
#
# 验证心跳：
#   docker logs ground-reporter | grep "6.6 heartbeat sent"
#
# 区别说明：
#   dist/docker-compose-report.yml   — 生产部署，FAULT_RECORD_URL 等指向真实平台
#   reportEnv/docker-compose-report.yml — 验证环境，URL 指向 mock-platform（本地测试）
# =============================================================

services:
  ground-reporter:
    image: harbor.naivehero.top:8443/macda2/ground-reporter:v2.5.1
    container_name: ground-reporter
    hostname: ground-reporter
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=redpanda-1:9092,redpanda-2:9092,redpanda-3:9092
      # 各协议章节上报接口（验证环境指向 mock-platform）
      - FAULT_RECORD_URL=http://mock-platform:8188/gate/METRO-PHM/api/faultRecordsSubsystem/saveRecord
      - SYS_STATUS_URL=http://mock-platform:8188/gate/METRO-SELFCHECK-SUBSYSTEM/api/faultRecordsSubsystem/saveStatus
      - LIFE_RECORD_URL=http://mock-platform:8188/gate/METRO-PHM/api/devices/status/train/saveOrUpdate
      - PLATFORM_API_KEY=
      - PLATFORM_TIMEOUT_SEC=10
      - PLATFORM_RETRY_MAX=3
      - PLATFORM_RETRY_BACKOFF_MS=1000
      # 空调子系统标识（固定）
      - SUBSYSTEM_CODE=5
      - TRAIN_TYPE=B
      # 心跳周期1分钟（Issue #1 修复：需求要求每1分钟发送运行状态心跳）
      - HEARTBEAT_INTERVAL_MIN=1
      - DAILY_BATCH_HOUR=0
      - LOG_LEVEL=INFO
    depends_on:
      mock-platform:
        condition: service_healthy
    networks:
      - macdanet

  mock-platform:
    image: golang:1.24-alpine
    container_name: mock-platform
    hostname: mock-platform
    restart: unless-stopped
    working_dir: /app
    command: go run main.go -port 8188
    volumes:
      - /data/MACDA2/connect/tests/mock-platform:/app:ro
    ports:
      - "18188:8188"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8188/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - macdanet

networks:
  macdanet:
    name: macdanet
    driver: bridge
    external: true
